<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  
  <!-- Subtle Grid Pattern -->
  <g stroke="#1E293B" stroke-width="1" opacity="0.4">
    <line x1="80" y1="0" x2="80" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="560" y1="0" x2="560" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="880" y1="0" x2="880" y2="630"/>
    <line x1="1040" y1="0" x2="1040" y2="630"/>
    <line x1="0" y1="105" x2="1200" y2="105"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="0" y1="525" x2="1200" y2="525"/>
  </g>

  <!-- Outer Border Frame -->
  <rect x="32" y="32" width="1136" height="566" rx="16" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Brand Pill Header -->
  <g transform="translate(80, 80)">
    <rect width="210" height="34" rx="17" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <circle cx="18" cy="17" r="5" fill="#10B981"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1">NEXT WEB WORKS</text>
    <text x="145" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748B">· PLAYBOOK</text>
  </g>

  <!-- Typography Content -->
  <g transform="translate(80, 180)">
    <rect width="130" height="26" rx="6" fill="#1E3A8A" fill-opacity="0.5" stroke="#2563EB" stroke-width="1"/>
    <text x="10" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#60A5FA" letter-spacing="1.5">AGENCY STRATEGY</text>
    
    <text x="0" y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#F8FAFC" letter-spacing="-1">The White-Label Playbook</text>
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#94A3B8">How Marketing Agencies Ship Custom Web Apps</text>
    <text x="0" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#94A3B8">Without Hiring In-House Engineering Teams</text>
  </g>

  <!-- Architectural Diagram Schematic (Right Side) -->
  <g transform="translate(720, 160)">
    <!-- Main Pod Card -->
    <rect width="380" height="340" rx="12" fill="#0B0F19" stroke="#1E293B" stroke-width="1.5"/>
    
    <!-- Header of Card -->
    <rect width="380" height="42" rx="12" fill="#0F172A"/>
    <circle cx="20" cy="21" r="5" fill="#EF4444" opacity="0.8"/>
    <circle cx="36" cy="21" r="5" fill="#F59E0B" opacity="0.8"/>
    <circle cx="52" cy="21" r="5" fill="#10B981" opacity="0.8"/>
    <text x="75" y="26" font-family="monospace" font-size="12" fill="#64748B">white-label-handover.spec.ts</text>
    
    <!-- Schematic Nodes -->
    <!-- Node 1: Marketing Agency -->
    <rect x="30" y="65" width="320" height="56" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="46" y="92" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#F8FAFC">Marketing Agency Client Face</text>
    <text x="46" y="109" font-family="monospace" font-size="11" fill="#94A3B8">Introduced as Lead Engineering Partner</text>
    
    <!-- Connector Arrow -->
    <line x1="190" y1="121" x2="190" y2="155" stroke="#2563EB" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="190,160 185,150 195,150" fill="#2563EB"/>

    <!-- Node 2: White-Label Barrier -->
    <rect x="30" y="160" width="320" height="56" rx="8" fill="#172554" stroke="#2563EB" stroke-width="1.5"/>
    <text x="46" y="187" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#60A5FA">Mutual NDA &amp; Zero-Branding Protocol</text>
    <text x="46" y="204" font-family="monospace" font-size="11" fill="#93C5FD">Zero NWW Credits · Direct Git Repo Handover</text>

    <!-- Connector Arrow -->
    <line x1="190" y1="216" x2="190" y2="250" stroke="#10B981" stroke-width="2" stroke-dasharray="4,4"/>
    <polygon points="190,255 185,245 195,245" fill="#10B981"/>

    <!-- Node 3: Next.js Engineering Delivery -->
    <rect x="30" y="255" width="320" height="56" rx="8" fill="#064E3B" fill-opacity="0.3" stroke="#10B981" stroke-width="1"/>
    <text x="46" y="282" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" fill="#34D399">Production Delivery Engine</text>
    <text x="46" y="299" font-family="monospace" font-size="11" fill="#A7F3D0">Next.js 15 · Typed Architecture · Staging QA</text>
  </g>

  <!-- Footer Tagline -->
  <g transform="translate(80, 530)">
    <text x="0" y="0" font-family="monospace" font-size="13" fill="#64748B">AUTHOR: DEVANSH · FOUNDER &amp; LEAD ENGINEER · NEXT WEB WORKS</text>
  </g>
</svg>

